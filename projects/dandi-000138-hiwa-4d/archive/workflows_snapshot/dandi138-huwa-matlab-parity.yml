name: Compare exact original MATLAB HiWA P Q R algebra and d2-in-D6 subspace algorithm
on:
  push:
    branches: [main]
    paths: [.github/workflows/dandi138-huwa-matlab-parity.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-author:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact dependencies
        run: python -m pip install "numpy>=1.26" "scipy>=1.12" "scikit-learn>=1.4" "matplotlib>=3.8"
      - name: Compare MATLAB one iteration matrix orientation and complete 5-cluster d2 in D6 recovery
        run: |
          python -u projects/dandi-000138-hiwa-4d/code/audit_author_hiwa_parity_and_subspaces.py \
            --output projects/dandi-000138-hiwa-4d/results/author_matlab_code_audit \
            --instances 91 92 93
      - name: Confirm parity checks true correspondence assessment and published report
        run: |
          python - <<'PY'
          import json,numpy as np
          from pathlib import Path
          p=Path('projects/dandi-000138-hiwa-4d/results/author_matlab_code_audit')
          d=json.loads((p/'HIWA_AUTHOR_SOURCE_AUDIT_RESULTS.json').read_text())
          assert d['matlab_one_step']['parity_passed']
          assert max(d['matlab_one_step']['maximum_elementwise_errors'].values()) < 5e-9
          assert d['ground_truth_R_only_postfit'] and d['true_cross_domain_correspondence_only_postfit']
          assert d['group_labels_used_for_within_domain_partition_author_semi_supervised']
          assert set(d['author_like_comparisons'])=={'91','92','93'}
          for rec in d['author_like_comparisons'].values():
              assert len(rec)==4
              for k,z in rec.items():
                  assert 0<=z['true_correspondence_mass']<=1
                  assert np.isfinite(z['Rgt_alignment_relative_MSE'])
                  assert np.linalg.norm(np.array(z['R']).T@np.array(z['R'])-np.eye(6))<1e-6
          assert (p/'HIWA_AUTHOR_SOURCE_AUDIT_REPORT.md').stat().st_size>1800
          print('PASS original MATLAB literal update parity, source-target independent low-rank and 4 full solver comparisons per instance')
          PY
      - name: Commit source audit without modifying existing baseline/solver
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/dandi-000138-hiwa-4d/results/author_matlab_code_audit
          if ! git diff --cached --quiet; then
            git commit -m 'Audit MATLAB HiWA parity and local subspace projection original-like synthetic recovery, isolate parameter budgets'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dandi138-author-MATLAB-HIWA-parity-subspace-audit
          path: projects/dandi-000138-hiwa-4d/results/author_matlab_code_audit
          if-no-files-found: warn
