name: DANDI138 POSTFIT geometry test of true pairwise distance preservation
on:
  push:
    branches: [main]
    paths: [.github/workflows/dandi138-postfit-paired-geometry.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  postfit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "numpy>=1.26" "scipy>=1.12" "scikit-learn>=1.4" "matplotlib>=3.8"
      - name: Only after model training, compute true synchronized TEST pair-distance correlation
        run: |
          python -u projects/dandi-000138-hiwa-4d/code/postfit_paired_distance_diagnostic.py \
            --clusters projects/dandi-000138-hiwa-4d/results/clustering/clustered_4d.npz \
            --baseline projects/dandi-000138-hiwa-4d/results/strict_unsupervised_hard_soft/STRICT_UNSUPERVISED_RESULTS.json \
            --results projects/dandi-000138-hiwa-4d/results/target_only_geometry_full/TARGET_TRANSFORM_RESULTS.json \
            --output projects/dandi-000138-hiwa-4d/results/target_only_geometry_full
      - name: Test no paired info returns to optimization
        run: |
          python - <<'PY'
          import json,numpy as np
          from pathlib import Path
          p=Path('projects/dandi-000138-hiwa-4d/results/target_only_geometry_full')
          v=json.loads((p/'POSTFIT_DISTANCE_GEOMETRY_AUDIT.json').read_text())
          assert v['postfit_evaluation_only']
          assert v['used_for_any_grouping_training_or_parameter_selection'] is False
          assert v['num_heldout_windows']==3500
          assert v['pair_samples']>90000
          assert len(v['all_four_modes'])==4
          for name,z in v['all_four_modes'].items():
              assert np.isfinite(list(z.values())).all()
              assert -1<=z['Pearson_distance_corr']<=1
              assert -1<=z['Spearman_distance_corr']<=1
          assert (p/'POSTFIT_ONLY_PAIRED_DISTANCE_PRESERVATION.png').stat().st_size>50000
          print('PASS: synchronized information used only postfit for distance-preservation audit')
          PY
      - name: Commit postfit-only diagnostic figure and audit, not learned model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/dandi-000138-hiwa-4d/results/target_only_geometry_full/POSTFIT_DISTANCE_GEOMETRY_AUDIT.json \
              projects/dandi-000138-hiwa-4d/results/target_only_geometry_full/POSTFIT_ONLY_PAIRED_DISTANCE_PRESERVATION.png
          if ! git diff --cached --quiet; then
            git commit -m 'Audit rigid geometry by test-only cross-trial paired distance preservation across target transforms'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DANDI138-postfit-distance-geometry-diagnostic
          path: |
            projects/dandi-000138-hiwa-4d/results/target_only_geometry_full/POSTFIT_ONLY_PAIRED_DISTANCE_PRESERVATION.png
            projects/dandi-000138-hiwa-4d/results/target_only_geometry_full/POSTFIT_DISTANCE_GEOMETRY_AUDIT.json
          if-no-files-found: warn
