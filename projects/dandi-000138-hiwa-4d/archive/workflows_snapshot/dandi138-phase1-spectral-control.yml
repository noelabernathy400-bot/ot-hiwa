name: DANDI138 Phase1 spectral identification of original synthetic R and P solver local minima
on:
  push:
    branches: [main]
    paths: [.github/workflows/dandi138-phase1-spectral-control.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synthetic-marginal-spectral-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "numpy>=1.26" "scipy>=1.12" "scikit-learn>=1.4" "matplotlib>=3.8"
      - name: Check all 16 covariance eigenspace signs against same unpaired TRAIN OT, no truth labels in fitting
        run: |
          python -u projects/dandi-000138-hiwa-4d/code/preflight_spectral_alignment_control.py \
            --positive-control-results projects/dandi-000138-hiwa-4d/results/phase1_synthetic_control/SYNTHETIC_POSITIVE_CONTROL_RESULTS.json \
            --output projects/dandi-000138-hiwa-4d/results/phase1_spectral_control
      - name: Verify source-target pairing forbidden and actual train selected spectral results
        run: |
          python - <<'PY'
          import json,numpy as np
          from pathlib import Path
          p=Path('projects/dandi-000138-hiwa-4d/results/phase1_spectral_control')
          d=json.loads((p/'SPECTRAL_GEOMETRY_POSITIVE_CONTROL.json').read_text())
          assert not d['training_uses_synchronized_pairing']
          assert not d['training_uses_true_rotation']
          assert d['labels_used_only_postfit']
          assert d['old_solver_selected_by_same_unsupervised_240x240_training_W2_not_test_labels']
          assert len(d['regimes'])==2
          for regime,r in d['regimes'].items():
              e=r['eigen_sign_alignment']
              assert len(e['all_sign_candidate_train_W2sq'])==16
              assert e['training_W2sq']<=min(e['all_sign_candidate_train_W2sq'])+1e-12
              assert 0<=e['heldout_group_1NN_accuracy']<=1
          assert (p/'SPECTRAL_VS_RANDOM_SOLVER_POSITIVE_CONTROL.png').stat().st_size>50000
          print('PASS: known synthetic R only postfit; strict train-only unpaired spectral candidate selection')
          PY
      - name: Publish reproducible geometric identifiability diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/dandi-000138-hiwa-4d/results/phase1_spectral_control
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'Publish marginal-only spectral initialization positive control vs original random-seed HiWA solver'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DANDI138-Phase1-unpaired-spectral-identifiability-control
          path: projects/dandi-000138-hiwa-4d/results/phase1_spectral_control
          if-no-files-found: warn
