name: DANDI138 joint OT membership pilot
on:
  push:
    branches: [main]
    paths: [.github/workflows/dandi138-joint-ot-pilot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "numpy>=1.26" "scipy>=1.12" "scikit-learn>=1.4" "matplotlib>=3.8"
      - name: Pilot alternating GCOT and OT-guided four KMeans membership gates
        run: |
          python -u projects/dandi-000138-hiwa-4d/code/joint_ot_guided_membership.py \
            --fixed projects/dandi-000138-hiwa-4d/results/source_only_fixed_groups/fixed_groups_4d.npz \
            --archive projects/dandi-000138-hiwa-4d/results/controlled_hard_vs_soft_PQ/CONTROLLED_ABLATION.json \
            --boundary projects/dandi-000138-hiwa-4d/results/boundary_adaptive_trial_cv/BOUNDARY_ADAPTIVE_RESULTS.json \
            --output projects/dandi-000138-hiwa-4d/results/joint_ot_pilot \
            --pilot --rounds 1 --outer 5 --inner 3 --local-sinkhorn 15 \
            --opt-iter 2 --inner-q-iters 35 --test-q-iters 70
      - name: Audit output and conditional KL descent
        run: |
          python - <<'PY'
          import json,numpy as np
          from pathlib import Path
          p=Path('projects/dandi-000138-hiwa-4d/results/joint_ot_pilot')
          d=json.loads((p/'JOINT_OT_RESULTS.json').read_text())
          assert d['not_full_unrestricted_joint_optimizer'] if 'not_full_unrestricted_joint_optimizer' in d else d['four_dimensional_normalized_data']
          assert d['frozen_KMeans_group_argmax']
          assert d['all_target_weights_copied_from_synchronized_source_index']
          assert len(d['test_runs'])==1 and len(d['validation_runs'])==1
          for t in d['test_runs'][0]['train_steps']:
              if t['theta_step_accepted']:
                  assert t['proxy_after']<t['proxy_before']
          assert np.isfinite(list(d['test_runs'][0]['metrics'].values())).all()
          print('PASS: joint-membership pilot source labels, no test tuning, KL descent')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DANDI138-joint-ot-pilot
          path: projects/dandi-000138-hiwa-4d/results/joint_ot_pilot
          if-no-files-found: warn
