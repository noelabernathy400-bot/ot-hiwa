name: DANDI138 Phase1B convergence sensitivity outer500 on same instances
on:
  push:
    branches:
      - experiment/dandi-phase1-multiinstance-pilot-20261119
    paths:
      - .github/workflows/dandi138-phase1-outer500-convergence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outer500-control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12" "scikit-learn>=1.4" "matplotlib>=3.8"
      - name: Repeat EXACT phase1A instance0, optimizer seeds42-43, with outer500 rather than outer180
        run: |
          python -u projects/dandi-000138-hiwa-4d/code/phase1_multiinstance_hard_pilot.py \
            --output projects/dandi-000138-hiwa-4d/results/phase1_outer500_same_instance_control \
            --instances 0 --seeds 42 43 --outer 500 --inner 20 --per-cluster 24
      - name: Validate complete Q and unchanged geometry comparison
        run: |
          python - <<'PY'
          import json,numpy as np
          from pathlib import Path
          p=Path("projects/dandi-000138-hiwa-4d/results/phase1_outer500_same_instance_control")
          r=json.loads((p/"RESULTS.json").read_text())
          assert r["setting"]["outer"]==500
          assert len(r["runs"])==8
          assert {x["instance"] for x in r["runs"]}=={0}
          assert len(list((p/"plans").glob("*.npz")))==8
          for x in r["runs"]:
              assert np.linalg.norm(np.asarray(x["R"]).T@np.asarray(x["R"])-np.eye(4))<1e-6
          print("PASS: exact-same-instance convergence-control budget outer500")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DANDI138-phase1B-outer500-convergence-PQR
          path: projects/dandi-000138-hiwa-4d/results/phase1_outer500_same_instance_control
          if-no-files-found: warn
