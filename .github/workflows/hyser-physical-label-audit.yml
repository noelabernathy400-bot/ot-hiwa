name: Hyser 1250 posthoc physical-meaning audit

on:
  push:
    paths:
      - ".github/workflows/hyser-physical-label-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "scikit-learn>=1.4,<2" "matplotlib>=3.8,<4"
      - name: Fetch verified Hyser five-trial feature archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/phys_hyser"
          gh release download hyser-s01-s1-random-5trials-v1 --pattern hyser_s01_s1_random_5trials_features_cv.zip --dir "$RUNNER_TEMP/phys_hyser"
          unzip -q "$RUNNER_TEMP/phys_hyser/hyser_s01_s1_random_5trials_features_cv.zip" -d "$RUNNER_TEMP/phys_hyser"
      - name: Compute post-hoc cluster to force-state associations
        run: |
          python experiments/hyser/expanded_five_trials/physical_labels_posthoc.py \
            --data "$RUNNER_TEMP/phys_hyser/derived/all_five_trials_UNSCALED_windows.npz" \
            --out experiments/hyser/expanded_five_trials/results_1250/physical_meaning
      - name: Save analysis to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/hyser/expanded_five_trials/results_1250/physical_meaning
          if ! git diff --cached --quiet; then
            git commit -m "Audit post-hoc physical force profiles of independent Hyser clusters"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hyser-physical-force-interpretability
          path: experiments/hyser/expanded_five_trials/results_1250/physical_meaning/
          if-no-files-found: error
