name: Hyser five-finger physical interpretation of K4 and K5 clusters

on:
  push:
    paths:
      - ".github/workflows/hyser-5finger-physical-k5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "scikit-learn>=1.4,<2" "matplotlib>=3.8,<4"
      - name: Fetch five physical finger force data by official channel names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hyser5_phys"
          gh release download hyser-s01-s1-random-5trials-v1 --pattern hyser_s01_s1_5fingers_5D_folds_v1.zip --dir "$RUNNER_TEMP/hyser5_phys"
          unzip -q "$RUNNER_TEMP/hyser5_phys/hyser_s01_s1_5fingers_5D_folds_v1.zip" -d "$RUNNER_TEMP/hyser5_phys"
      - name: Plot independently clustered K4 and K5 and assess five original force channels
        run: |
          python experiments/hyser/expanded_five_trials/fivefinger_k5_physical_audit.py \
            --data "$RUNNER_TEMP/hyser5_phys/all_five_trials_fivefinger_raw_and_emg.npz" \
            --out experiments/hyser/expanded_five_trials/results_5finger_physical
      - name: Validate physical features with no forced finger-to-cluster labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("experiments/hyser/expanded_five_trials/results_5finger_physical")
          o=json.loads((p/"fivefinger_K4_K5_physical_summary.json").read_text())
          assert len(o["summary"])==4
          assert not o["physical_finger_to_cluster_labels_are_NOT_ground_truth"] is False
          assert len(list(p.glob("*.png")))>=7
          for row in o["summary"]:
            assert sum(row["sizes"])==1250
          print("Verified 5-finger physical audit")
          PY
      - name: Publish plots and full physical cluster profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/hyser/expanded_five_trials/results_5finger_physical
          if ! git diff --cached --quiet; then
            git commit -m "Plot true five-finger K5 cluster structure and original finger-force profiles"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyser-fivefinger-K5-physical-audit
          path: experiments/hyser/expanded_five_trials/results_5finger_physical/
          if-no-files-found: warn
          retention-days: 90
