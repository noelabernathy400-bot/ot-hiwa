name: Hyser full1000 identity unpaired ICP and single-level OT baselines

on:
  push:
    paths:
      - ".github/workflows/hyser-additional-unpaired-baselines.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "matplotlib>=3.8,<4"
      - name: Fetch original fold-disjoint representations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hyser_baselines"
          gh release download hyser-s01-s1-random-5trials-v1 \
            --pattern hyser_pca_fa_both_domains_trainonly_6configs_v1.zip \
            --dir "$RUNNER_TEMP/hyser_baselines"
          unzip -q "$RUNNER_TEMP/hyser_baselines/hyser_pca_fa_both_domains_trainonly_6configs_v1.zip" \
            -d "$RUNNER_TEMP/hyser_baselines"
      - name: Run 4 representations x 5 folds x 2 seeds real train1000 unpaired baselines
        run: |
          python experiments/hyser/expanded_five_trials/additional_unsupervised_baselines.py \
            --features "$RUNNER_TEMP/hyser_baselines" \
            --existing experiments/hyser/expanded_five_trials/results_3D_5D_unified \
            --out experiments/hyser/expanded_five_trials/results_3D_5D_unified/additional_baselines
      - name: Verify number of actual baselines and original HiWA references
        run: |
          python - <<'PY'
          import csv,pathlib,json
          p=pathlib.Path("experiments/hyser/expanded_five_trials/results_3D_5D_unified/additional_baselines")
          rows=list(csv.DictReader((p/"all_baselines_by_fold_seed.csv").open()))
          sm=list(csv.DictReader((p/"unpaired_baseline_summary.csv").open()))
          assert len(rows)==100 and len(sm)==20,(len(rows),len(sm))
          assert {x["method"] for x in rows}=={"identity","icp","single_ot"}
          assert json.loads((p/"provenance.json").read_text())["n_full1000_HiWA_frozen_models"]==80
          assert (p/"hyser_additional_baselines_hit_q05.png").stat().st_size>10000
          print("Hyser baseline rows validated, including all failed runs")
          PY
      - name: Commit new baselines only, leave frozen full1000 results untouched
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/hyser/expanded_five_trials/results_3D_5D_unified/additional_baselines
          if ! git diff --cached --quiet; then
            git commit -m "Report Hyser full1000 unpaired ICP singleOT identity baselines"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyser-additional-unpaired-baselines
          path: experiments/hyser/expanded_five_trials/results_3D_5D_unified/additional_baselines
          retention-days: 90
          if-no-files-found: warn
