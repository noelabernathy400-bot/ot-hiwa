name: DANDI 000138 - 4D hard clustering
on:
  push:
    branches:
      - experiments/dandi-000138-4d-hard-clustering-20261117
    paths:
      - .github/workflows/dandi-000138-hard-clustering.yml
  workflow_dispatch:
jobs:
  run-real-data-clustering:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out source snapshot
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dandi>=0.61" "h5py>=3" "numpy>=1.26" "scipy>=1.12" "scikit-learn>=1.4" "matplotlib>=3.8"
      - name: Download official MC_Maze_Large NWB data
        run: |
          mkdir -p raw_dandi_000138
          dandi download "DANDI:000138/0.220113.0407" -o raw_dandi_000138
          find raw_dandi_000138 -type f -name '*.nwb' -print
      - name: Inspect NLB hand time-series layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import h5py
          files=sorted(Path('raw_dandi_000138').rglob('*desc-train*.nwb'))
          with h5py.File(files[0],'r') as h:
              print('NWB root groups:',list(h.keys()))
              print('Trial columns:',list(h['intervals/trials'].keys()))
              def show(name,obj):
                  if isinstance(obj,h5py.Group) and 'data' in obj and ('hand' in name.lower() or 'cursor' in name.lower()):
                      print('Series:',name,'shape:',obj['data'].shape,'fields:',list(obj.keys()))
              h.visititems(show)
          PY
      - name: Run 4D K-means and generate projection figures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,sys
          files=sorted(Path('raw_dandi_000138').rglob('*.nwb'))
          if not files:
              raise FileNotFoundError('Official DANDI 000138 download contained no NWB')
          train=[p for p in files if 'train' in p.name.lower() and 'test' not in p.name.lower()]
          chosen=train[0] if train else files[0]
          print('Selected official NWB:',chosen,flush=True)
          cmd=[sys.executable,'-m','experiments.dandi_000138.run_hard_clustering',
               '--nwb',str(chosen.resolve()),'--k','4','--seed','42',
               '--output','results/dandi_000138/hard_clustering']
          subprocess.run(cmd,cwd='research/GCOT-reproducible-20261018/GC-OT',check=True)
          PY
      - name: Archive results and diagnostic logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dandi-000138-hard-clustering-4d
          path: |
            research/GCOT-reproducible-20261018/GC-OT/results/dandi_000138/hard_clustering/
          if-no-files-found: warn
