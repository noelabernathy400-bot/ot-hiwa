name: Hyser exact 70pct physical error threshold with random baseline and fold stability

on:
  push:
    paths:
      - ".github/workflows/hyser-dense-70pct-physical-threshold.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "matplotlib>=3.8,<4"
      - name: Download frozen training-only 5D representations for original force vectors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hyser_70"
          gh release download hyser-s01-s1-random-5trials-v1 \
            --pattern hyser_pca_fa_both_domains_trainonly_6configs_v1.zip \
            --dir "$RUNNER_TEMP/hyser_70"
          unzip -q "$RUNNER_TEMP/hyser_70/hyser_pca_fa_both_domains_trainonly_6configs_v1.zip" \
            -d "$RUNNER_TEMP/hyser_70"
          test -f "$RUNNER_TEMP/hyser_70/PCA5_RAW5/trial_heldout_1_5d.npz"
      - name: Derive dense thresholds, exact random baseline and 5-fold stability without OT refitting
        run: |
          python experiments/hyser/expanded_five_trials/dense_70pct_force_threshold_audit.py \
            --features "$RUNNER_TEMP/hyser_70" \
            --results-root experiments/hyser/expanded_five_trials/results_3D_5D_unified \
            --out experiments/hyser/expanded_five_trials/results_3D_5D_unified/threshold_70_audit
      - name: Verify all eight model curves and reproducibility outputs
        run: |
          python - <<'PY'
          import json,csv,pathlib
          p=pathlib.Path("experiments/hyser/expanded_five_trials/results_3D_5D_unified/threshold_70_audit")
          a=list(csv.DictReader((p/"epsilon_70_exact_null.csv").open()))
          b=list(csv.DictReader((p/"per_trial_threshold_stability.csv").open()))
          c=json.loads((p/"audit_provenance.json").read_text())
          assert len(a)==8 and len(b)==40 and c["n_full1000_frozen_runs"]==80
          assert all(float(x["actual_hit_at_epsilon"]) >= 0.70 for x in a)
          assert all(0 <= float(x["random_bank_exact_hit_at_same_epsilon"]) <= 1 for x in a)
          assert (p/"dense_physical_threshold_with_exact_random.png").stat().st_size>10000
          assert (p/"training_quantile_threshold_with_exact_random.png").stat().st_size>10000
          print("VERIFIED: Eight model 70pct thresholds and exact physical-null baselines")
          PY
      - name: Save exact plots, CSV, provenance and report under Hyser only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/hyser/expanded_five_trials/results_3D_5D_unified/threshold_70_audit
          if ! git diff --cached --quiet; then
            git commit -m "Audit Hyser 70 percent success thresholds with full exact random baseline"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyser-dense-70pct-physical-threshold-audit
          path: experiments/hyser/expanded_five_trials/results_3D_5D_unified/threshold_70_audit
          retention-days: 90
          if-no-files-found: warn
