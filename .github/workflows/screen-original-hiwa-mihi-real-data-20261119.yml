name: Candidate real HiWA original monkey-reaching DATA preflight no OT training
on:
  push:
    branches:
      - screening/real-data-preflight-hiwa-demo-20261119
    paths:
      - .github/workflows/screen-original-hiwa-mihi-real-data-20261119.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "numpy>=1.26" "scipy>=1.12" "scikit-learn>=1.4" "matplotlib>=3.8"
      - name: Download authors' official actual recorded monkey data (small 106KB mat)
        run: |
          python - <<'PY'
          from urllib.request import urlopen,Request
          from pathlib import Path
          import hashlib
          url='https://raw.githubusercontent.com/nerdslab/PyHiWA/master/data/mihi_demo.mat'
          with urlopen(Request(url,headers={'User-Agent':'reproducible-hiwa-mihi-preflight/1.0'}),timeout=90) as data:
              raw=data.read()
          assert 90000<len(raw)<120000,len(raw)
          dest=Path('/tmp/mihi_demo.mat');dest.write_bytes(raw)
          print('ACTUAL_AUTHORS_MAT',len(raw),hashlib.sha256(raw).hexdigest(),flush=True)
          PY
      - name: Inspect input geometry group structure postfit truth without OT / without labels at fitting
        run: |
          python -u projects/candidate-data-screening/hiwa-mihi-original-2019/inspect_mihi_demo.py \
            --input /tmp/mihi_demo.mat \
            --output projects/candidate-data-screening/hiwa-mihi-original-2019/preflight_results
      - name: Verify real 4-group data, results and labels never enter unsupervised fit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('projects/candidate-data-screening/hiwa-mihi-original-2019/preflight_results')
          d=json.loads((p/'REAL_MIHIDEMO_PREFLIGHT.json').read_text())
          assert d['same_direction_class_set']
          assert len(d['source_label_counts'])==len(d['target_label_counts'])==4
          assert d['LABELS_NEVER_USED_FOR_OT_FITTING'] and d['only_unsupervised_kmeans_and_fa_fitted']
          assert d['author_original_demo_was_not_strict_unpaired_group_discovery']
          assert d['no_trial_metadata_verified']
          assert (p/d['plot']).stat().st_size>20000
          print('PASS dataset-only preregistered geometry eligibility screen; NO OT run')
          PY
      - name: Save new candidate data preflight only, no changes to DANDI or Hyser
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/candidate-data-screening/hiwa-mihi-original-2019/preflight_results
          if ! git diff --cached --quiet; then
            git commit -m 'Record actual original HiWA monkey real dataset preflight before any OT training'
            git pull --rebase origin screening/real-data-preflight-hiwa-demo-20261119
            git push origin HEAD:screening/real-data-preflight-hiwa-demo-20261119
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ORIGINAL-HIWA-MIHI-real-dataset-preflight-ONLY
          path: projects/candidate-data-screening/hiwa-mihi-original-2019/preflight_results
          if-no-files-found: warn
