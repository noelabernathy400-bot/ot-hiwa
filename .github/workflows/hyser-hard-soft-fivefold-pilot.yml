name: Hyser 5-fold Hard vs Soft hierarchical pilot

on:
  push:
    paths:
      - ".github/workflows/hyser-hard-soft-fivefold-pilot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controlled-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "scikit-learn>=1.4,<2" "matplotlib>=3.8,<4"
      - name: Download verified fold-split features from existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hyser_release"
          gh release download hyser-s01-s1-random-5trials-v1 \
            --pattern hyser_s01_s1_random_5trials_features_cv.zip \
            --dir "$RUNNER_TEMP/hyser_release"
          unzip -q "$RUNNER_TEMP/hyser_release/hyser_s01_s1_random_5trials_features_cv.zip" \
            -d "$RUNNER_TEMP/hyser_release"
          test -f "$RUNNER_TEMP/hyser_release/derived/trial_heldout_5.npz"
      - name: Fit Hard and Soft independently, evaluate across all five heldout trials
        run: |
          python experiments/hyser/expanded_five_trials/run_hard_soft_pilot.py \
            --data-dir "$RUNNER_TEMP/hyser_release/derived" \
            --out experiments/hyser/expanded_five_trials/results_hard_soft_pilot \
            --seeds 42 43 --folds 1 2 3 4 5 --anchors 96 --outer 45
      - name: Verify completeness of 20 runs and shared-reference metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("experiments/hyser/expanded_five_trials/results_hard_soft_pilot/results_all.json")
          o=json.loads(p.read_text())
          assert len(o["runs"])==20, len(o["runs"])
          combos={(x["holdout_fold"],x["seed"],x["method"]) for x in o["runs"]}
          assert len(combos)==20 and all(x["pair_synchrony_never_used_in_training"] for x in o["runs"])
          for x in o["runs"]:
            assert x["train_n_per_domain"]==1000 and x["heldout_n_per_domain"]==250
            assert "after" in x["heldout_common_hard_K4_reference"], x
            assert x["train"]["training_result_at_final_global_R"]["marginal_max"]<1e-5
          print("Verified 20 trial-heldout independent unpaired runs, metrics and numeric constraints")
          PY
      - name: Commit finished experiment tables and plot
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/hyser/expanded_five_trials/results_hard_soft_pilot
          if ! git diff --cached --quiet; then
            git commit -m "Record five-trial heldout Hyser Hard-vs-Soft hierarchical OT pilot"
            git push origin HEAD:main
          fi
      - name: Save the raw evidence even if convergence checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyser-fivefold-hard-soft-pilot-evidence
          path: experiments/hyser/expanded_five_trials/results_hard_soft_pilot/
          if-no-files-found: warn
          retention-days: 90
