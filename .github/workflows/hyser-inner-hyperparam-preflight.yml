name: Hyser PRETEST inner-only hyperparameter preflight K4K5 tau0250501 mu00200501

on:
  push:
    paths:
      - ".github/workflows/hyser-inner-hyperparam-preflight.yml"
      - "experiments/hyser/expanded_five_trials/inner_hyperparameter_preflight.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        rep: [PCA3_PCA3, FA3_FA3, PCA5_RAW5, FA5_RAW5]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python libraries
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "scikit-learn>=1.4,<2" "matplotlib>=3.8,<4"
      - name: Download TRUE original 256-channel EMG and 5-finger force windows, not outer test fitted representations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hyser-inner"
          gh release download hyser-s01-s1-random-5trials-v1 \
            --pattern hyser_s01_s1_5fingers_5D_folds_v1.zip --dir "$RUNNER_TEMP/hyser-inner"
          unzip -q "$RUNNER_TEMP/hyser-inner/hyser_s01_s1_5fingers_5D_folds_v1.zip" \
            -d "$RUNNER_TEMP/hyser-inner"
          test -f "$RUNNER_TEMP/hyser-inner/all_five_trials_fivefinger_raw_and_emg.npz"
      - name: Test only inner heldout trial 2 of outer trial 1, never touch outer trial 1
        run: |
          python experiments/hyser/expanded_five_trials/inner_hyperparameter_preflight.py \
            --input "$RUNNER_TEMP/hyser-inner/all_five_trials_fivefinger_raw_and_emg.npz" \
            --representation "${{ matrix.rep }}" \
            --out "experiments/hyser/expanded_five_trials/results_3D_5D_unified/inner_parameter_preflight/${{ matrix.rep }}" \
            --maxiter 120
      - name: Verify all 24 candidates, no model or preprocessing has seen outer test trial
        env:
          REP: ${{ matrix.rep }}
        run: |
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path("experiments/hyser/expanded_five_trials/results_3D_5D_unified/inner_parameter_preflight")/os.environ["REP"]
          x=json.loads((p/"inner_preflight_all24.json").read_text())
          assert x["candidate_count"]==len(x["runs"])==24
          assert x["outer_holdout_has_never_entered_any_fit_or_parameter_selection"]
          assert all(q["outer_holdout_UNTOUCHED"]==1 and q["inner_validation_trial"]==2 for q in x["runs"])
          assert {(r["K"],r["ADMM_mu"],r["method"],r["tau"]) for r in x["runs"]} == {
            (k,mu,method,tau) for k in (4,5) for mu in (.02,.05,.1) for method,tau in
               [("hard",None),("soft",.25),("soft",.5),("soft",1.0)]
          }
          print("Valid candidates",sum(r["qualified"] for r in x["runs"]),"/24; ONLY ONE INNER fold, not an external prediction victory")
          PY
      - name: Publish raw inner-training parameter candidate logs, including failures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "experiments/hyser/expanded_five_trials/results_3D_5D_unified/inner_parameter_preflight/${{ matrix.rep }}"
          if ! git diff --cached --quiet; then
            git commit -m "Audit inner-only Hyser K/tau/mu parameter grid for ${{ matrix.rep }} without outer test leakage"
            for try in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "hyser-inner-parameter-${{ matrix.rep }}"
          path: "experiments/hyser/expanded_five_trials/results_3D_5D_unified/inner_parameter_preflight/${{ matrix.rep }}"
          retention-days: 90
          if-no-files-found: warn
