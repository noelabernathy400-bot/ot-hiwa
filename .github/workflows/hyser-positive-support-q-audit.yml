name: Hyser exact-positive-Q full1000 zero-mass solver regression, fold3

on:
  push:
    paths:
      - ".github/workflows/hyser-positive-support-q-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify_q_and_admm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "scikit-learn>=1.4,<2" "matplotlib>=3.8,<4"
      - name: Download full 1000 original train-only PCA5 source and full five-finger targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hyser_q"
          gh release download hyser-s01-s1-random-5trials-v1 --pattern hyser_pca_fa_both_domains_trainonly_6configs_v1.zip --dir "$RUNNER_TEMP/hyser_q"
          unzip -q "$RUNNER_TEMP/hyser_q/hyser_pca_fa_both_domains_trainonly_6configs_v1.zip" -d "$RUNNER_TEMP/hyser_q"
      - name: Run full 1000 K4 Hard and Soft local Rkl-Qkl-ADMM with same exact positive-mass supports
        run: |
          python experiments/hyser/expanded_five_trials/local_PQR_ADMM_hyser.py \
            --features "$RUNNER_TEMP/hyser_q" \
            --out experiments/hyser/expanded_five_trials/results_full1000_positive_Q_fold3 \
            --configs PCA5_RAW5 --folds 3 --seeds 42 \
            --maxiter 300 --sa-maxiter 40 --mu 0.05 --warm-start-local \
            --full-training --exact-positive-support --numerically-stable-Q
      - name: Verify exact conditional Q support sizes and marginal balance
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,numpy as np
          p=Path("experiments/hyser/expanded_five_trials/results_full1000_positive_Q_fold3")
          o=json.loads((p/"local_ADMM_results.json").read_text())
          assert len(o["runs"])==2
          for r in o["runs"]:
            assert r["n_OT_train_source"]==1000 and r["n_OT_train_target"]==1000
            assert r["exact_nonzero_support_no_mass_removed"]
            assert r["params"]["support_mode"]=="positive"
            assert r["Q_constraints_passed"],f"{r['method']} Q marginal error {r['max_final_Q_marginal_error']}"
            assert all(q["total_mass"]>1-1e-7 for q in r["q_stats"])
            assert np.linalg.norm(np.array(r["R"]).T@np.array(r["R"])-np.eye(5))<1e-7
            print("MODE",r["method"],"K4 Q shapes",set(tuple(x["shape"]) for x in r["q_stats"]),
                  "Qerr",r["max_final_Q_marginal_error"],
                  "ADMM converged",r["numeric_convergence_ADMM_primal_and_rotation"],
                  "primal",r["diagnostics"]["admm_primal_residual"]["last"])
          print("PASSED mathematically exact full 1000-data Q/P/Rkl support audit")
          PY
      - name: Commit complete original-Q support regression evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/hyser/expanded_five_trials/results_full1000_positive_Q_fold3
          if ! git diff --cached --quiet; then
            git commit -m "Verify real 1000-point full local PQR ADMM with exact Hard/Soft probability support, repairing zero-mass Sinkhorn error"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyser-exact-positive-support-Q-full1000-fold3
          path: experiments/hyser/expanded_five_trials/results_full1000_positive_Q_fold3/
          if-no-files-found: warn
