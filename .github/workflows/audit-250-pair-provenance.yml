name: Audit real 250-pair data provenance and four-dimensional cache
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-250-pair-provenance.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data-reading dependencies
        run: python -m pip install numpy scipy
      - name: Show exact original 250-pair source and cached 4D shapes, no modification
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          from scipy.io import loadmat
          p=Path('data/mihi_demo.mat')
          a=loadmat(p)
          print('ORIGINAL MAT CONTENTS')
          for k,v in a.items():
              if not k.startswith('__'):
                  print(k, getattr(v,'shape',None),getattr(v,'dtype',None))
          for name in ['projects/dandi-000138-hiwa-4d/results/clustering/clustered_4d.npz',
             'projects/dandi-000138-hiwa-4d/results/source_only_fixed_groups/fixed_groups_4d.npz']:
              print('FILE',name)
              with np.load(name,allow_pickle=False) as z:
                  for k in z.files:
                      v=z[k]
                      print(k,v.shape,v.dtype)
          PY
