name: Hyser three-dimensional heldout NN and best 2D projection control

on:
  push:
    paths:
      - ".github/workflows/hyser-3d-best2d-nearest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "scikit-learn>=1.4,<2" "matplotlib>=3.8,<4"
      - name: Get train-only 3D PCA/FA embeddings from five-finger force measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hyser_3d_nn"
          gh release download hyser-s01-s1-random-5trials-v1 --pattern hyser_pca_fa_both_domains_trainonly_6configs_v1.zip --dir "$RUNNER_TEMP/hyser_3d_nn"
          unzip -q "$RUNNER_TEMP/hyser_3d_nn/hyser_pca_fa_both_domains_trainonly_6configs_v1.zip" -d "$RUNNER_TEMP/hyser_3d_nn"
      - name: Select 2D visuals with training data and compute 80 heldout 3D nearest-neighbor statistics
        run: |
          python experiments/hyser/expanded_five_trials/heldout_3d_nn.py \
            --features "$RUNNER_TEMP/hyser_3d_nn" \
            --frozen-results experiments/hyser/expanded_five_trials/results_PCA_FA_OT/OT_results_all.json \
            --out experiments/hyser/expanded_five_trials/results_3D_best2D_NN
      - name: Verify actual 80 test cases
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("experiments/hyser/expanded_five_trials/results_3D_best2D_NN")
          o=json.loads((p/"3D_all_heldout_NN.json").read_text())
          assert len(o["runs"])==80 and len(o["summary"])==8
          assert (p/"best_3D_to_2D_views_independent.png").exists()
          assert (p/"threeD_complete_point_clouds.png").exists()
          print("Verified 80 actual heldout three-dimensional NN evaluations")
          PY
      - name: Commit data and figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/hyser/expanded_five_trials/results_3D_best2D_NN
          if ! git diff --cached --quiet; then
            git commit -m "Record Hyser full-finger 3D PCA/FA train-only best 2D views and nearest-neighbor evaluation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyser-threeD-NN-benchmark
          path: experiments/hyser/expanded_five_trials/results_3D_best2D_NN
          if-no-files-found: warn
