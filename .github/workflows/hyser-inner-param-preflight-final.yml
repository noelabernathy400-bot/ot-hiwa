name: Hyser summarize 96 actual inner-only K tau mu candidates against independent physical random baseline

on:
  push:
    paths:
      - ".github/workflows/hyser-inner-param-preflight-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "scikit-learn>=1.4,<2" "matplotlib>=3.8,<4"
      - name: Download only original Hyser raw five-finger force for random-null benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hyser-inner-null"
          gh release download hyser-s01-s1-random-5trials-v1 \
            --pattern hyser_s01_s1_5fingers_5D_folds_v1.zip \
            --dir "$RUNNER_TEMP/hyser-inner-null"
          unzip -q "$RUNNER_TEMP/hyser-inner-null/hyser_s01_s1_5fingers_5D_folds_v1.zip" \
            -d "$RUNNER_TEMP/hyser-inner-null"
          test -f "$RUNNER_TEMP/hyser-inner-null/all_five_trials_fivefinger_raw_and_emg.npz"
      - name: Audit 96 completed inner train-only candidates and same physical chance baseline
        run: |
          python experiments/hyser/expanded_five_trials/aggregate_inner_parameter_preflight.py \
            --in-dir experiments/hyser/expanded_five_trials/results_3D_5D_unified/inner_parameter_preflight \
            --data "$RUNNER_TEMP/hyser-inner-null/all_five_trials_fivefinger_raw_and_emg.npz" \
            --out experiments/hyser/expanded_five_trials/results_3D_5D_unified/inner_parameter_preflight/summary
      - name: Verify 96 candidate actual model runs and honest preflight limits
        run: |
          python - <<'PY'
          import csv,pathlib,json
          p=pathlib.Path("experiments/hyser/expanded_five_trials/results_3D_5D_unified/inner_parameter_preflight/summary")
          a=json.loads((p/"inner_only_four_representations_summary.json").read_text())
          assert a["n_candidates"]==96 and a["outer_trial_entirely_untouched"]==1
          assert a["no_external_model_selection_or_claim_of_generalization"]
          with (p/"all_96_inner_candidates.csv").open() as f:
            assert len(list(csv.DictReader(f)))==96
          print("96 real parameter fits, four representations, genuine inner-only physical-null calibration.")
          PY
      - name: Save preflight validity tables in same repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/hyser/expanded_five_trials/results_3D_5D_unified/inner_parameter_preflight/summary
          if ! git diff --cached --quiet; then
            git commit -m "Audit 96 no-leak inner-only K/tau/mu HiWA fits against five-finger force random-null baseline"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyser-inner-96-candidate-audit-and-physical-baseline
          path: experiments/hyser/expanded_five_trials/results_3D_5D_unified/inner_parameter_preflight/summary/
          if-no-files-found: warn
