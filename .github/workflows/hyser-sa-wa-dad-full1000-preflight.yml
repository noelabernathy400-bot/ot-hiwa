name: Hyser SA WA modifiedDAD full1000 port smoke and correctness preflight
on:
  push:
    paths:
      - ".github/workflows/hyser-sa-wa-dad-full1000-preflight.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "scikit-learn>=1.4,<2" "matplotlib>=3.8,<4"
      - name: Download Hyser representation archive from frozen release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hyser1000"
          gh release download hyser-s01-s1-random-5trials-v1 \
            --pattern hyser_pca_fa_both_domains_trainonly_6configs_v1.zip \
            --dir "$RUNNER_TEMP/hyser1000"
          unzip -q "$RUNNER_TEMP/hyser1000/hyser_pca_fa_both_domains_trainonly_6configs_v1.zip" -d "$RUNNER_TEMP/hyser1000"
      - name: 3D source DANDI exact SA WA and DAD-like port first-fold full1000 smoke
        run: |
          python experiments/hyser/expanded_five_trials/sa_wa_dad_dandi_port_full1000.py \
            --features "$RUNNER_TEMP/hyser1000" \
            --reference experiments/hyser/expanded_five_trials/results_3D_5D_unified \
            --representation PCA3_PCA3 \
            --folds 1 --wa-seeds 42 \
            --out experiments/hyser/expanded_five_trials/results_3D_5D_unified/sa_wa_dad_full1000_smoke/PCA3_PCA3
      - name: 5D SA WA first-fold and strict no fake 5D-DAD
        run: |
          python experiments/hyser/expanded_five_trials/sa_wa_dad_dandi_port_full1000.py \
            --features "$RUNNER_TEMP/hyser1000" \
            --reference experiments/hyser/expanded_five_trials/results_3D_5D_unified \
            --representation PCA5_RAW5 \
            --folds 1 --wa-seeds 42 \
            --out experiments/hyser/expanded_five_trials/results_3D_5D_unified/sa_wa_dad_full1000_smoke/PCA5_RAW5
      - name: Assert 1000 learned samples and positive-definite numerical data
        run: |
          python - <<'PY'
          import json,pathlib,numpy as np
          base=pathlib.Path("experiments/hyser/expanded_five_trials/results_3D_5D_unified/sa_wa_dad_full1000_smoke")
          for rep,expected in (("PCA3_PCA3",{"SA","WA","DAD_like_3D"}),("PCA5_RAW5",{"SA","WA"})):
              runs=json.loads((base/rep/"runs_bundle.json").read_text())["all_results_including_failures"]
              assert {r["method"] for r in runs}==expected
              assert all(r["qualified"] for r in runs),[(r["method"],r.get("error")) for r in runs]
              assert all(r["source_train_n"]==r["target_train_n"]==1000 and r["test_n"]==250 for r in runs)
              assert all(np.linalg.norm(np.array(r["R"]).T@np.array(r["R"])-np.eye(np.array(r["R"]).shape[0]))<1e-6 for r in runs)
          print("PASS: SA WA modifiedDAD real full1000 pool; no 5D DAD invented.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyser-sawad-full1000-smoke
          path: experiments/hyser/expanded_five_trials/results_3D_5D_unified/sa_wa_dad_full1000_smoke
          retention-days: 30
          if-no-files-found: warn
