name: Build Hyser LaTeX report PDF
on:
  push:
    branches: [main]
    paths:
      - "experiments/hyser/Hyser_Hard_HiWA_实验报告.tex"
      - "experiments/hyser/figures/clouds_base36.txt"
      - "experiments/hyser/scripts/expand_clouds.py"
      - "experiments/hyser/scripts/render_report_figures.py"
      - "experiments/hyser/figures/original200_base36.txt"
      - ".github/workflows/hyser-latex-report.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand documented 250-point figure data
        run: python3 experiments/hyser/scripts/expand_clouds.py
      - name: Install plotting dependencies and generate source-based images
        run: |
          python3 -m pip install --quiet numpy matplotlib
          python3 experiments/hyser/scripts/render_report_figures.py
      - name: Compile XeLaTeX PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: Hyser_Hard_HiWA_实验报告.tex
          working_directory: experiments/hyser
          os: debian
          latexmk_use_xelatex: true
      - name: Commit compiled report into experiment root
        run: |
          test -s experiments/hyser/Hyser_Hard_HiWA_实验报告.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f experiments/hyser/Hyser_Hard_HiWA_实验报告.pdf
          git add -f experiments/hyser/figures/initial200_hard_clusters_fourpanel.png
          git add -f experiments/hyser/figures/all250_whitened_hard_clusters_3D.png
          git add -f experiments/hyser/figures/all250_after_hard_hiwa_3D_overlay.png
          git add -f experiments/hyser/figures/all250_after_hard_hiwa_2D_overlay.png
          if ! git diff --cached --quiet; then
            git commit -m "Compile Hyser experiment PDF from LaTeX"
            git push
          fi
