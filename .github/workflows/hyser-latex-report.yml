name: Build latest Hyser known-group Hard HiWA report
on:
  push:
    branches: [main]
    paths:
      - "experiments/hyser/data/visual_points_base36.txt"
      - "experiments/hyser/results/latest.json"
      - "experiments/hyser/results/soft_experiment_20261117.json"
      - "experiments/hyser/scripts/render_soft_figures.py"
      - "experiments/hyser/scripts/render_figures.py"
      - "experiments/hyser/Hyser_HardHiWA_最新实验.tex"
      - ".github/workflows/hyser-latex-report.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render latest authentic Hyser paired groups
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          python3 -m pip install --quiet numpy matplotlib
          python3 experiments/hyser/scripts/render_figures.py
          python3 experiments/hyser/scripts/render_soft_figures.py
          test -s experiments/hyser/figures/01_before_hiwa.png
          test -s experiments/hyser/figures/02_after_hiwa_free.png
          test -s experiments/hyser/figures/03_after_hiwa_fixed.png
          test -s experiments/hyser/figures/05_hard_vs_soft_paired_2d3d.png
          test -s experiments/hyser/figures/06_soft_source_membership.png
      - name: XeLaTeX with explicit Chinese font
        uses: xu-cheng/latex-action@v4
        with:
          root_file: Hyser_HardHiWA_最新实验.tex
          working_directory: experiments/hyser
          os: debian
          latexmk_use_xelatex: true
          extra_system_packages: "fonts-noto-cjk poppler-utils"
          post_compile: |
            pdffonts "Hyser_HardHiWA_最新实验.pdf" | grep -F 'NotoSerifCJK'
            pdftotext "Hyser_HardHiWA_最新实验.pdf" - | grep -F '肌电'
      - name: Save ONLY new PDF and new figures
        run: |
          test -s experiments/hyser/Hyser_HardHiWA_最新实验.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f experiments/hyser/Hyser_HardHiWA_最新实验.pdf
          git add -f experiments/hyser/figures/00_complete_comparison.png
          git add -f experiments/hyser/figures/01_before_hiwa.png
          git add -f experiments/hyser/figures/02_after_hiwa_free.png
          git add -f experiments/hyser/figures/03_after_hiwa_fixed.png
          git add -f experiments/hyser/figures/04_free_group_transport.png
          git add -f experiments/hyser/figures/05_hard_vs_soft_paired_2d3d.png
          git add -f experiments/hyser/figures/06_soft_source_membership.png
          git add -f experiments/hyser/figures/07_paired_R2_comparison.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest source-only Hyser Hard HiWA PDF and plots"
            # Other project workflows can update main during XeLaTeX compilation.
            # Rebase our additive generated-files commit, never force-push.
            git fetch origin main
            git rebase origin/main
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main
            done
            echo "Could not push after 3 safe retries" >&2
            exit 1
          fi
