name: Hyser FA5 original-local-PQR-ADMM 300 iteration convergence diagnostic

on:
  push:
    paths:
      - ".github/workflows/hyser-local-admm-300step.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "scikit-learn>=1.4,<2" "matplotlib>=3.8,<4"
      - name: Download fixed FA5 source plus five physical finger target folds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hyser300"
          gh release download hyser-s01-s1-random-5trials-v1 --pattern hyser_pca_fa_both_domains_trainonly_6configs_v1.zip --dir "$RUNNER_TEMP/hyser300"
          unzip -q "$RUNNER_TEMP/hyser300/hyser_pca_fa_both_domains_trainonly_6configs_v1.zip" -d "$RUNNER_TEMP/hyser300"
      - name: Refit true 16-block full-Q local HiWA-style ADMM with original 300-outer-iter cap
        run: |
          python experiments/hyser/expanded_five_trials/local_PQR_ADMM_hyser.py \
            --features "$RUNNER_TEMP/hyser300" \
            --out experiments/hyser/expanded_five_trials/results_local_ADMM_FA5_300 \
            --folds 1 --seeds 42 --configs FA5_RAW5 --maxiter 300 --sa-maxiter 40 \
            --save-first-Q
      - name: Audit full local Q and convergence, do not suppress failure
        run: |
          python - <<'PY'
          import json,pathlib,numpy as np
          p=pathlib.Path("experiments/hyser/expanded_five_trials/results_local_ADMM_FA5_300")
          a=json.loads((p/"local_ADMM_results.json").read_text())
          assert len(a["runs"])==2
          for r in a["runs"]:
            assert len(r["q_stats"])==16
            assert max(abs(np.array(r["P"]).sum(0)-.25).max(),abs(np.array(r["P"]).sum(1)-.25).max())<1e-7
            print(r["method"],"Converged?",r["numeric_convergence_ADMM_primal_and_rotation"],
                  "last_R_change",r["diagnostics"]["Rg_norm"]["last"],
                  "last_primal",r["diagnostics"]["admm_primal_residual"]["last"])
          print("Preserving both converged and nonconverged results")
          PY
      - name: Commit numeric robustness record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/hyser/expanded_five_trials/results_local_ADMM_FA5_300
          if ! git diff --cached --quiet; then
            git commit -m "Audit FA5 HiWA local PQR ADMM up to original 300 outer iterations with strict residual checks"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyser-FA5-localADMM-300step-Q-and-convergence
          path: experiments/hyser/expanded_five_trials/results_local_ADMM_FA5_300/
          if-no-files-found: warn
