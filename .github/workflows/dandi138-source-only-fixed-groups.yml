name: DANDI 000138 fixed source-only KMeans and HiWA
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dandi138-source-only-fixed-groups.yml
      - projects/dandi-000138-hiwa-4d/code/source_only_fixed_group_pipeline.py
      - projects/dandi-000138-hiwa-4d/code/evaluate_fixed_group_alignment.py
      - projects/dandi-000138-hiwa-4d/code/write_fixed_group_report.py
      - projects/dandi-000138-hiwa-4d/四维HiWA统一源域分组实验.tex
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-only-fixed-label-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific libraries
        run: |
          python -m pip install "numpy>=1.26" "scipy>=1.12" "scikit-learn>=1.4" "matplotlib>=3.8"
      - name: Fit exactly one KMeans on training SOURCE; inherit labels on target
        run: |
          python projects/dandi-000138-hiwa-4d/code/source_only_fixed_group_pipeline.py \
            --input projects/dandi-000138-hiwa-4d/results/clustering/clustered_4d.npz \
            --output projects/dandi-000138-hiwa-4d/results/source_only_fixed_groups \
            --seed 42 --k 4
      - name: Run original uploaded Hard HiWA on one fixed group assignment
        run: |
          python projects/dandi-000138-hiwa-4d/code/run_hard_hiwa.py \
            --clusters projects/dandi-000138-hiwa-4d/results/source_only_fixed_groups/fixed_groups_4d.npz \
            --output projects/dandi-000138-hiwa-4d/results/source_only_fixed_groups \
            --seeds 42 43 44 45 46
      - name: Recompute held-out 1NN MAE rMSE and R2 and draw alignment panels
        run: |
          python projects/dandi-000138-hiwa-4d/code/evaluate_fixed_group_alignment.py \
            --input projects/dandi-000138-hiwa-4d/results/source_only_fixed_groups/fixed_groups_4d.npz \
            --alignment projects/dandi-000138-hiwa-4d/results/source_only_fixed_groups/hard_hiwa_results.json \
            --output projects/dandi-000138-hiwa-4d/results/source_only_fixed_groups
      - name: Strict invariant checks
        run: |
          python - <<'PY'
          import json, numpy as np
          from pathlib import Path
          r=Path('projects/dandi-000138-hiwa-4d/results/source_only_fixed_groups')
          g=json.loads((r/'group_protocol.json').read_text())
          m=json.loads((r/'frozen_label_metrics.json').read_text())
          with np.load(r/'fixed_groups_4d.npz') as z:
            c=z['shared_labels']
            assert np.array_equal(c,z['neural_groups'])
            assert np.array_equal(c,z['hand_groups'])
            assert len(c)==17500
          assert sum(g['source_group_sizes'])==14000
          assert g['source_group_sizes']==g['target_group_sizes']
          assert g['target_clustering_performed']==False
          assert m['source_and_target_labels_identical'] and m['paired_labels_use_supervision']
          assert len(m['seed_results'])==5
          assert all(np.isfinite([s['metrics']['R2'],s['metrics']['MAE'],s['metrics']['one_nn_shared_group']]).all() for s in m['seed_results'])
          print('PASS: exactly one fixed source-derived label family, full 4D test metrics')
          PY
      - name: Write Markdown summary and LaTeX score table
        run: |
          python projects/dandi-000138-hiwa-4d/code/write_fixed_group_report.py
      - name: Install XeLaTeX for reproducible updated project PDF
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended \
            fonts-noto-cjk fonts-liberation fonts-dejavu-core poppler-utils
      - name: Compile single-source-group project PDF
        run: |
          cd projects/dandi-000138-hiwa-4d
          mkdir -p _latex_build
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error -output-directory=_latex_build '四维HiWA统一源域分组实验.tex'
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error -output-directory=_latex_build '四维HiWA统一源域分组实验.tex'
          cp '_latex_build/四维HiWA统一源域分组实验.pdf' '四维HiWA统一源域分组实验.pdf'
          test -s '四维HiWA统一源域分组实验.pdf'
          pdfinfo '四维HiWA统一源域分组实验.pdf' | grep Pages
      - name: Commit real experimental results and PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'projects/dandi-000138-hiwa-4d/results/source_only_fixed_groups' \
             'projects/dandi-000138-hiwa-4d/EXPERIMENT_LOG.md' \
             'projects/dandi-000138-hiwa-4d/四维HiWA统一源域分组实验.pdf'
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'Publish actual source-only four-group KMeans, new HiWA fit, plots, metrics and XeLaTeX report'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload reproducible experimental artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dandi138-one-fixed-source-group-HiWA
          path: |
            projects/dandi-000138-hiwa-4d/results/source_only_fixed_groups
            projects/dandi-000138-hiwa-4d/四维HiWA统一源域分组实验.pdf
            projects/dandi-000138-hiwa-4d/四维HiWA统一源域分组实验.tex
          if-no-files-found: warn
