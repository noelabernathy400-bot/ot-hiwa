name: Hyser 3D full1000 5fold PCA3 and FA3 Hard-Soft K4 local PQR ADMM

on:
  push:
    paths:
      - ".github/workflows/hyser-full1000-3D-fivefold.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hyser-20261119-full1000-3d
  cancel-in-progress: false

jobs:
  train_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        representation: ["PCA3_PCA3", "FA3_FA3"]
        heldout_trial: [1, 2, 3, 4, 5]
        seed: [42, 43]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed scientific Python requirements
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "scikit-learn>=1.4,<2" "matplotlib>=3.8,<4"
      - name: Download true full 1000 train plus 250 test windows with training-only PCA5/FA5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hyser"
          gh release download hyser-s01-s1-random-5trials-v1 \
            --pattern hyser_pca_fa_both_domains_trainonly_6configs_v1.zip \
            --dir "$RUNNER_TEMP/hyser"
          unzip -q "$RUNNER_TEMP/hyser/hyser_pca_fa_both_domains_trainonly_6configs_v1.zip" \
            -d "$RUNNER_TEMP/hyser"
          test -f "$RUNNER_TEMP/hyser/${{ matrix.representation }}/trial_heldout_${{ matrix.heldout_trial }}.npz"
      - name: Train BOTH Hard and Soft on ALL 1000 samples of each domain with full local Q/P/Rkl and ADMM
        run: |
          python experiments/hyser/expanded_five_trials/local_PQR_ADMM_3D.py \
            --features "$RUNNER_TEMP/hyser" \
            --out "experiments/hyser/expanded_five_trials/results_formal_full1000_3D/${{ matrix.representation }}/fold_${{ matrix.heldout_trial }}/seed_${{ matrix.seed }}" \
            --configs "${{ matrix.representation }}" \
            --folds "${{ matrix.heldout_trial }}" \
            --seeds "${{ matrix.seed }}" \
            --maxiter 300 --sa-maxiter 40 \
            --mu 0.05 --warm-start-local --full-training --exact-positive-support --numerically-stable-Q
      - name: Independently audit full Q dimensions and solver constraints without hiding ADMM nonconvergence
        env:
          REPRESENTATION: ${{ matrix.representation }}
          FOLD: ${{ matrix.heldout_trial }}
          SEED: ${{ matrix.seed }}
        run: |
          python - <<'PY'
          import os,json,pathlib,numpy as np
          p=pathlib.Path("experiments/hyser/expanded_five_trials/results_formal_full1000_3D")/os.environ["REPRESENTATION"]/("fold_"+os.environ["FOLD"])/("seed_"+os.environ["SEED"])
          d=json.loads((p/"local_ADMM_results.json").read_text())
          assert len(d["runs"])==2 and not d["not_full_1000_point_OT"]
          assert {r["method"] for r in d["runs"]}=={"hard","soft05"}
          for r in d["runs"]:
            assert r["heldout_trial"]==int(os.environ["FOLD"]) and r["seed"]==int(os.environ["SEED"])
            assert r["n_OT_train_source"]==1000 and r["n_OT_train_target"]==1000
            assert r["n_heldout_test"]==250 and r["K"]==4
            assert len(r["q_stats"])==16 and all(0<z["shape"][0]<=1000 and 0<z["shape"][1]<=1000 and abs(z["total_mass"]-1)<1e-6 for z in r["q_stats"])
            assert np.array(r["local_rotations_Rkl"]).shape==(3,3,4,4)
            assert np.array(r["P"]).shape==(4,4)
            assert r["Q_constraints_passed"] and r["max_final_Q_marginal_error"]<1e-5
            assert r["params"]["mu"]==.05 and r["params"]["sa_shorn_gamma"]==.1
            assert r["params"]["shorn_gamma"]==.2 and r["params"]["warm_start_local"]
            assert r["params"]["support_mode"]=="positive" and r["stable_conditional_Q_solver_if_needed"]
            assert r["train_bank_inductive_nearest"]["target_test_pool_not_used_for_retrieval"]
            print("AUDIT",r["method"],"converged",r["numeric_convergence_ADMM_primal_and_rotation"],
                  "primal",r["diagnostics"]["admm_primal_residual"]["last"],
                  "globalR_change",r["diagnostics"]["Rg_norm"]["last"],
                  "inductiveNNhit",r["train_bank_inductive_nearest"]["train_bank_NN_physically_correct"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "hyser-threeD-${{ matrix.representation }}-f${{ matrix.heldout_trial }}-s${{ matrix.seed }}"
          path: "experiments/hyser/expanded_five_trials/results_formal_full1000_3D/${{ matrix.representation }}/fold_${{ matrix.heldout_trial }}/seed_${{ matrix.seed }}/"
          retention-days: 90
          if-no-files-found: warn

  consolidate:
    needs: train_and_test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "matplotlib>=3.8,<4"
      - uses: actions/download-artifact@v4
        with:
          pattern: hyser-threeD-*
          path: ${{ runner.temp }}/hyser-threeD-artifacts
          merge-multiple: false
      - name: Aggregate all jobs, qualification gates and fixed-pair Hard/Soft test differences
        run: |
          python experiments/hyser/expanded_five_trials/aggregate_full1000_local_admm_3D.py \
            --artifacts-dir "$RUNNER_TEMP/hyser-threeD-artifacts" \
            --support-mode positive \
            --out experiments/hyser/expanded_five_trials/results_formal_full1000_3D/summary
      - name: Verify all expected cases were reported, not silently excluded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("experiments/hyser/expanded_five_trials/results_formal_full1000_3D/summary/full1000_summary.json")
          q=json.loads(p.read_text())
          print("Observed",q["runs_observed"],"/",q["runs_expected"],
                "qualified matched pairs",q["eligible_matched_pairs"],"/",q["paired_expected"])
          print("Status",q["status"],"issues",q["issues"])
          assert (p.parent/"FORMAL_COMPARISON_REPORT_ZH.md").exists()
          assert (p.parent/"ADMM_primal_convergence_diagnostic.png").exists()
          PY
      - name: Persist the original JSON and raw per-run numeric evidence in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p experiments/hyser/expanded_five_trials/results_formal_full1000_3D/individual_runs
          cp -R "$RUNNER_TEMP/hyser-threeD-artifacts/"* \
            experiments/hyser/expanded_five_trials/results_formal_full1000_3D/individual_runs/
          git add experiments/hyser/expanded_five_trials/results_formal_full1000_3D
          if ! git diff --cached --quiet; then
            git commit -m "Archive 40 3D all1000 PCA/FA local PQR Hard/Soft tests with strict numerical audit"
            for trial in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyser-full1000-3D-consolidated-executive-report
          path: experiments/hyser/expanded_five_trials/results_formal_full1000_3D/summary/
          if-no-files-found: warn
          retention-days: 90
