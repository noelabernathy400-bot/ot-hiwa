name: Hyser recover and audit frozen all-1000 formal 40-run evidence

on:
  push:
    paths:
      - ".github/workflows/hyser-recover-formal-v1.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "matplotlib>=3.8,<4"
      - name: Download all previously completed 20 matrix artifacts, no retraining
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hyser-formal-v1"
          gh run download 44455956733 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'hyser-formal-*' \
            --dir "$RUNNER_TEMP/hyser-formal-v1"
          find "$RUNNER_TEMP/hyser-formal-v1" -name local_ADMM_results.json -print | wc -l
      - name: Build strict 40-run consolidated table and convergence-gated comparison from real files
        run: |
          python experiments/hyser/expanded_five_trials/aggregate_full1000_local_admm.py \
            --artifacts-dir "$RUNNER_TEMP/hyser-formal-v1" \
            --out experiments/hyser/expanded_five_trials/results_formal_full1000/summary
      - name: Verify exact 40 real runs and both qualified/nonqualified evidence preserved
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("experiments/hyser/expanded_five_trials/results_formal_full1000/summary")
          q=json.loads((p/"full1000_summary.json").read_text())
          assert q["runs_observed"]==40, q["issues"]
          assert q["runs_expected"]==40
          assert len(q["qualified_matches"])==20
          print("ALL 40 numerical fits retrieved. Qualified matched Hard-Soft pairs",
                q["eligible_matched_pairs"],"/20. Status",q["status"])
          PY
      - name: Commit all 40 raw cases and strict numerical conclusion after preventing duplicate expensive jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p experiments/hyser/expanded_five_trials/results_formal_full1000/individual_runs
          cp -R "$RUNNER_TEMP/hyser-formal-v1/"* \
            experiments/hyser/expanded_five_trials/results_formal_full1000/individual_runs/
          git add experiments/hyser/expanded_five_trials/results_formal_full1000
          if ! git diff --cached --quiet; then
            git commit -m "Archive every 1000-point 5fold 2seed PCA5/FA5 Hard/Soft run and flag Q/ADMM failures in model audit"
            for attempt in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyser-formal-v1-40-run-verified-qualification-report
          path: experiments/hyser/expanded_five_trials/results_formal_full1000/summary/
          if-no-files-found: warn
