name: CitiBike REAL June 2026 station inventory Parquet schema and snapshot audit
on:
  push:
    branches:
      - experiment/citibike-large-data-preflight-20261119
    paths:
      - .github/workflows/citibike-historical-stock-parquet-schema.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect-true-inventory-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "pyarrow>=15" "numpy>=1.26"
      - name: Download one historical Citi Bike June status file and inspect actual schema/rows
        run: |
          python -u - <<'PY'
          from pathlib import Path
          import hashlib,json,urllib.request
          import pyarrow.parquet as pq
          from datetime import date
          month='202606'
          url=f'https://data.citybik.es/dumps/by-network/2026/{month}-citi-bike-nyc-stats.parquet'
          req=urllib.request.Request(url,headers={'User-Agent':'noncommercial-research-citibike-stock-schema/1.0'})
          path=Path('/tmp')/(month+'-citi-bike-nyc-stats.parquet')
          n=0;sha=hashlib.sha256()
          with urllib.request.urlopen(req,timeout=300) as r,path.open('wb') as f:
              while True:
                  b=r.read(8<<20)
                  if not b:break
                  f.write(b);sha.update(b);n+=len(b)
          assert n==109289362,n
          pf=pq.ParquetFile(path)
          schema=pf.schema_arrow
          columns=schema.names
          sample=pf.read_row_group(0)
          few=sample.slice(0,3).to_pylist()
          info={'source':url,'original_file_bytes':n,
                'source_sha256':sha.hexdigest(),
                'source_license':'CityBikes ODbL and underlying operator terms, attribution required',
                'parquet_record_count':pf.metadata.num_rows,
                'parquet_row_groups':pf.metadata.num_row_groups,
                'schema':[{'name':f.name,'type':str(f.type)} for f in schema],
                'first_three_raw_rows_for_schema_illustration':few,
                'status':'REAL verified 2026-06 inventory history source; no P/Q OT fit',
                'data_not_claiming_actual_optimal_dispatch':True}
          out=Path('projects/citibike-hierarchical-ot/results/historical_inventory_schema')
          out.mkdir(parents=True,exist_ok=True)
          (out/'202606_CITYBIKES_REAL_STOCK_PARQUET_SCHEMA.json').write_text(
              json.dumps(info,ensure_ascii=False,indent=2,default=str)+'\n')
          print('REAL_STOCK_SCHEMA',json.dumps({k:v for k,v in info.items() if k!='first_three_raw_rows_for_schema_illustration'},default=str),flush=True)
          print('SAMPLE_STOCK',few,flush=True)
          PY
      - name: Verify true inventory fields and no false full operational claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('projects/citibike-hierarchical-ot/results/historical_inventory_schema/202606_CITYBIKES_REAL_STOCK_PARQUET_SCHEMA.json')
          d=json.loads(p.read_text())
          assert d['parquet_record_count']>10000
          assert d['original_file_bytes']==109289362
          assert d['data_not_claiming_actual_optimal_dispatch']
          assert len(d['schema'])>=5
          print('REAL CITYBIKES HISTORICAL STOCK SCHEMA VERIFIED',d['parquet_record_count'])
          PY
      - name: Commit only schema and audit in new Citi Bike project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/citibike-hierarchical-ot/results/historical_inventory_schema
          if ! git diff --cached --quiet; then
            git commit -m 'Audit genuine historical 2026 June NYC Citi Bike vehicle inventory Parquet and schema'
            git pull --rebase origin experiment/citibike-large-data-preflight-20261119
            git push origin HEAD:experiment/citibike-large-data-preflight-20261119
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CITIBIKE-ACTUAL-202606-STATION-STOCK-SCHEMA
          path: projects/citibike-hierarchical-ot/results/historical_inventory_schema
          if-no-files-found: warn
