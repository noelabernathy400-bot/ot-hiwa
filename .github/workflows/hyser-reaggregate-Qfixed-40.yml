name: Hyser final repaired 40-run fivefold validation and Fisher-only report

on:
  push:
    paths:
      - ".github/workflows/hyser-reaggregate-Qfixed-40.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical analysis and Fisher-only visualization requirements
        run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "scikit-learn>=1.4,<2" "matplotlib>=3.8,<4"
      - name: Recover immutable full five-trial PCA5 and FA5 representations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hyser-final"
          gh release download hyser-s01-s1-random-5trials-v1 \
            --pattern hyser_pca_fa_both_domains_trainonly_6configs_v1.zip \
            --dir "$RUNNER_TEMP/hyser-final"
          unzip -q "$RUNNER_TEMP/hyser-final/hyser_pca_fa_both_domains_trainonly_6configs_v1.zip" \
            -d "$RUNNER_TEMP/hyser-final"
      - name: Requalify 40 previously completed full-data Hard/Soft tests using mathematically exact positive-mass Q
        run: |
          python experiments/hyser/expanded_five_trials/aggregate_full1000_local_admm.py \
            --artifacts-dir experiments/hyser/expanded_five_trials/results_formal_full1000_Qfixed/individual_runs \
            --support-mode positive \
            --out experiments/hyser/expanded_five_trials/results_formal_full1000_Qfixed/summary
      - name: Require full fivefold paired Q/ADMM audit before scientific reporting
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("experiments/hyser/expanded_five_trials/results_formal_full1000_Qfixed/summary")
          s=json.loads((p/"full1000_summary.json").read_text())
          assert s["runs_observed"]==40
          assert s["eligible_matched_pairs"]==20
          assert s["status"]=="COMPLETE_ALL_CONVERGED"
          assert not s["issues"]
          assert all(r["n_converged"]==10 for r in s["full1000_means"])
          print("Validated all 40 numerical fits and all 20 matched Hard-Soft pairs")
          PY
      - name: Produce controlled fold-by-fold Hard/Soft effects and only Fisher 2D source/target scatter
        run: |
          python experiments/hyser/expanded_five_trials/formal_qfixed_analysis.py \
            --runs-dir experiments/hyser/expanded_five_trials/results_formal_full1000_Qfixed/individual_runs \
            --features "$RUNNER_TEMP/hyser-final" \
            --out experiments/hyser/expanded_five_trials/results_formal_full1000_Qfixed/final
      - name: Verify strictly paired results and exactly two final Fisher subspace charts
        run: |
          python - <<'PY'
          import json,pathlib,csv
          p=pathlib.Path("experiments/hyser/expanded_five_trials/results_formal_full1000_Qfixed/final")
          d=json.loads((p/"fold_summary.json").read_text())
          assert d["all40_qualified"] and len(d["results"])==2
          with (p/"ten_paired_seed_metrics.csv").open() as f:
            assert len(list(csv.DictReader(f)))==20
          with (p/"five_fold_averages.csv").open() as f:
            assert len(list(csv.DictReader(f)))==10
          assert len(list(p.glob("*formal_ADMM_Fisher2D.png")))==2
          assert len(list(p.glob("fivefold_*.png")))==3
          print("Verified fivefold ten-seed-paired comparisons, two Fisher-only 2D plots, three metric plots")
          PY
      - name: Commit corrected numerical comparison and Chinese research report into same GitHub repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/hyser/expanded_five_trials/results_formal_full1000_Qfixed/summary
          git add experiments/hyser/expanded_five_trials/results_formal_full1000_Qfixed/final
          if ! git diff --cached --quiet; then
            git commit -m "Finalize audited 40 true full1000 Hyser Hard-Soft PCA5 FA5 tests and Fisher-only visualizations"
            for try in 1 2 3 4 5 6 7 8; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyser-final-fisher-only-40run-report
          path: experiments/hyser/expanded_five_trials/results_formal_full1000_Qfixed/final/
          if-no-files-found: warn
          retention-days: 90
