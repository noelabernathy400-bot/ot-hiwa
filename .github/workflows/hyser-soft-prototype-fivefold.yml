name: Hyser fivefold Soft-GCOT prototype control

on:
  push:
    paths:
      - ".github/workflows/hyser-soft-prototype-fivefold.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prototype-control:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "scipy>=1.12,<2" "scikit-learn>=1.4,<2" "matplotlib>=3.8,<4"
      - name: Download original heldout fold data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hyser_data"
          gh release download hyser-s01-s1-random-5trials-v1 --pattern hyser_s01_s1_random_5trials_features_cv.zip --dir "$RUNNER_TEMP/hyser_data"
          unzip -q "$RUNNER_TEMP/hyser_data/hyser_s01_s1_random_5trials_features_cv.zip" -d "$RUNNER_TEMP/hyser_data"
      - name: Fit independent GCOT soft prototype on all 5 heldout folds, two seeds
        run: |
          python experiments/hyser/expanded_five_trials/run_soft_prototype_pilot.py \
            --data-dir "$RUNNER_TEMP/hyser_data/derived" \
            --baseline-results experiments/hyser/expanded_five_trials/results_hard_soft_pilot/results_all.json \
            --out experiments/hyser/expanded_five_trials/results_soft_GCOT_prototype \
            --seeds 42 43 --folds 1 2 3 4 5 --anchors 96 --outer 45
      - name: Check complete 10 prototypes fit with no leaked paired labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("experiments/hyser/expanded_five_trials/results_soft_GCOT_prototype/results_all.json")
          data=json.loads(p.read_text())
          assert len(data["runs"])==10
          assert len(data["combined_comparison"])==3
          assert all(r["pair_synchrony_never_used_in_training"] for r in data["runs"])
          for r in data["runs"]:
            assert r["train"]["training_result_at_final_global_R"]["marginal_max"]<1e-5
          print("Validated ten prototype grouping runs")
          PY
      - name: Commit full experimental results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/hyser/expanded_five_trials/results_soft_GCOT_prototype
          if ! git diff --cached --quiet; then
            git commit -m "Record fivefold Soft-GCOT prototype comparison under shared hierarchical solver"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyser-soft-prototype-fivefold-evidence
          path: experiments/hyser/expanded_five_trials/results_soft_GCOT_prototype
          if-no-files-found: warn
          retention-days: 90
