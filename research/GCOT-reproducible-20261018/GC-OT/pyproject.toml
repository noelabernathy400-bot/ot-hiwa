[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcot-reproduction"
version = "0.1.0"
description = "TPAMI GCOT alignment and author-grounded HiWA benchmarks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "matplotlib>=3.8", "threadpoolctl>=3.2", "h5py>=3.11", "pillow"]

[tool.setuptools.packages.find]
include = ["gcot*", "evaluation*", "experiments*", "visualization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
